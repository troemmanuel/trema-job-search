# Trema Job Search — orchestration locale / VPS : API FastAPI (:8000) + frontend Next.js (:3000)
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: trema-job-search-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - LOCAL_STORAGE_DIR=/app/candidatures
      # Origines autorisées à appeler l'API depuis un navigateur (frontend)
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      # Miroir local persistant des PDFs générés (CV, lettres)
      - ./candidatures:/app/candidatures
      # Prompts système montés à chaud, en lecture seule
      - ./apps/api/prompts:/app/prompts:ro
      # État du planificateur quotidien et journaux
      - ./apps/api/instance:/app/instance
      - ./apps/api/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # URL de l'API telle que vue par le navigateur (figée au build) : adaptez-la à votre domaine sur un VPS
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: trema-job-search-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
