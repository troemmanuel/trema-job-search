[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "flask>=3.0.0",
    "google-genai>=0.1.1",
    "notion-client>=2.2.1",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.0.0",
    "requests>=2.31.0",
    "supabase>=2.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
