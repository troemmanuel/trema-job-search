[project]
name = "trema-job-search-api"
version = "2.0.0"
description = "API FastAPI de l'agent IA de recherche d'emploi Trema Job Search"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "google-genai>=0.1.1",
    "notion-client>=2.2.1",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.0.0",
    "requests>=2.31.0",
    "supabase>=2.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "jinja2>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
