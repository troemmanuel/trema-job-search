{# Emplacements d'un document généré : lien Supabase signé + miroir local #}
<div class="doc-locations text-muted" style="font-size: 0.8rem; margin-top: 0.5rem; word-break: break-all;">
    <div>☁️ Supabase :
        {% if doc.url %}<a href="{{ doc.url }}" target="_blank">ouvrir le PDF stocké</a>{% else %}<em>absent du bucket</em>{% endif %}
    </div>
    <div>📁 Local{% if not doc.local_exists %} (fichier introuvable){% endif %} : <code>{{ doc.local }}</code></div>
</div>
